<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order | RAXY BOOSTER</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<header class="dashboard-header">

<div>

<h1>Place Order</h1>

<p>Fill in your order details</p>

</div>

<a href="services.html" class="btn-primary">← Back</a>

</header>

<div class="orders-card">

<form id="orderForm">

<label>Platform</label>

<select required>

<option>Instagram</option>
<option>TikTok</option>
<option>YouTube</option>
<option>Facebook</option>
<option>Telegram</option>
<option>WhatsApp</option>

</select>

<br><br>

<label>Service</label>

<select required>

<option>Followers</option>
<option>Likes</option>
<option>Views</option>
<option>Comments</option>

</select>

<br><br>

<label>Profile / Post Link</label>

<input
type="url"
placeholder="https://..."
required>

<br><br>

<label>Quantity</label>

<input
type="number"
placeholder="1000"
required>

<br><br>

<button
type="submit"
class="btn-primary">

Submit Order

</button>

</form>

</div>

</div>

</body>

</html>
