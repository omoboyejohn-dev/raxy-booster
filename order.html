<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order | RAXY BOOSTER</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>🚀 RAXY BOOSTER</h1>
            <p>Place Your Order</p>
        </div>

        <a href="dashboard.html" class="btn-primary">
            ← Dashboard
        </a>

    </header>

    <!-- Service Details -->

    <section class="orders-card">

        <h2>Selected Service</h2>

        <p><strong>Service:</strong></p>
        <p id="serviceName">Loading...</p>

        <p><strong>Platform:</strong></p>
        <p id="servicePlatform">Loading...</p>

        <p><strong>Price:</strong></p>
        <p id="servicePrice">₦0</p>

    </section>

    <!-- Order Form -->

    <section class="orders-card">

        <h2>Order Details</h2>

        <form id="orderForm">

            <label>Profile Link / Username</label>

            <input
                type="text"
                id="orderLink"
                placeholder="https://instagram.com/username"
                required>

            <label>Quantity</label>

            <input
                type="number"
                id="orderQuantity"
                min="1"
                placeholder="1000"
                required>

            <button
                type="submit"
                class="btn-primary">
                Place Order
            </button>

        </form>

    </section>

</div>

<script type="module" src="order.js"></script>

</body>

</html>
