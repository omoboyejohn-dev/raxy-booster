<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Raxy Booster</title>
</head>

<body>

  <h1>🛠 Admin Panel</h1>

  <h3>Add New Service</h3>

  <form id="serviceForm">
    <input type="text" id="name" placeholder="Service Name" required>
    <input type="text" id="platform" placeholder="Platform (TikTok, Instagram...)" required>
    <input type="number" id="price" placeholder="Price" required>
    <button type="submit">Add Service</button>
  </form>

  <hr>

  <h3>Services List</h3>
  <div id="servicesList"></div>

  <!-- Scripts -->
  <script type="module" src="admin.js"></script>
  <script type="module" src="admin-guard.js"></script>

</body>
</html>
