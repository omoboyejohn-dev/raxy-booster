<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAXY BOOSTER | Admin Panel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="admin-header">
            <h1>🛠 RAXY BOOSTER ADMIN PANEL</h1>
            <p>Manage all boosting services from one place.</p>

            <button id="logoutBtn">Logout</button>
        </header>

        <hr>

        <section class="admin-form">

            <h2>Add New Service</h2>

            <form id="serviceForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Service Name (e.g. Instagram Followers)"
                    required>

                <input
                    type="text"
                    id="platform"
                    placeholder="Platform (Instagram, TikTok, YouTube...)"
                    required>

                <input
                    type="number"
                    id="price"
                    placeholder="Price (₦)"
                    required>

                <button type="submit">
                    Add Service
                </button>

            </form>

        </section>

        <hr>

        <section class="services-section">

            <h2>Available Services</h2>

            <div id="servicesList">

                <p>No services yet...</p>

            </div>

        </section>

    </div>

    <!-- JavaScript -->
    <script type="module" src="admin.js"></script>
    <script type="module" src="admin-guard.js"></script>

</body>

</html>
