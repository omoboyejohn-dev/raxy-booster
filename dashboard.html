<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | RAXY BOOSTER</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>RAXY BOOSTER</h1>
            <p>Welcome back!</p>
        </div>

        <button id="logoutBtn" class="btn-danger">
            Logout
        </button>

    </header>

    <!-- User Info -->

    <section class="welcome-card">

        <h2>👤 Account</h2>

        <p><strong>Email:</strong></p>

        <p id="userEmail">Loading...</p>

    </section>

    <!-- Wallet -->

    <section class="wallet-card">

        <h3>💰 Wallet Balance</h3>

        <h1 id="walletBalance">₦0.00</h1>

        <div class="dashboard-buttons">

            <button id="fundWalletBtn" class="btn-primary">
                💳 Fund Wallet
            </button>

            <button id="placeOrderBtn" class="btn-primary">
                🛒 Place Order
            </button>

        </div>

    </section>

    <!-- Quick Actions -->

    <section class="orders-card">

        <h3>⚡ Quick Actions</h3>

        <div class="dashboard-buttons">

            <button id="orderHistoryBtn" class="btn-primary">
                📦 Order History
            </button>

            <button id="profileBtn" class="btn-primary">
                👤 Profile
            </button>

        </div>

    </section>

    <!-- Recent Orders -->

    <section class="orders-card">

        <h3>📋 Recent Orders</h3>

        <p>No orders yet.</p>

    </section>

</div>

<script type="module" src="dashboard.js"></script>

</body>

</html>
