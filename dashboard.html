<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | RAXY BOOSTER</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>🚀 RAXY BOOSTER</h1>
            <p>Welcome back!</p>
        </div>

        <button id="logoutBtn" class="btn-danger">
            Logout
        </button>

    </header>

    <!-- Account -->

    <section class="welcome-card">

        <h2>👤 Account</h2>

        <p><strong>Email:</strong></p>

        <p id="userEmail">Loading...</p>

    </section>

    <!-- Wallet -->

    <section class="wallet-card">

        <h2>💰 Wallet Balance</h2>

        <h1 id="walletBalance">₦0.00</h1>

        <button id="fundWalletBtn" class="btn-primary">
            Fund Wallet
        </button>

    </section>

    <!-- Services -->

    <section class="orders-card">

        <h2>🚀 Available Services</h2>

        <div id="servicesList" class="services-grid">

            <p>Loading services...</p>

        </div>

    </section>

    <!-- Orders -->

    <section class="orders-card">

        <h2>📋 My Orders</h2>

        <button id="orderHistoryBtn" class="btn-primary">
            View Order History
        </button>

    </section>

    <!-- Profile -->

    <section class="orders-card">

        <h2>⚙️ Account Settings</h2>

        <button id="profileBtn" class="btn-primary">
            My Profile
        </button>

    </section>

</div>

<script type="module" src="dashboard.js"></script>

</body>

</html>
